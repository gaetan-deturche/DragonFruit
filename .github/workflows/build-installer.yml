name: Build Windows Installer

# Personal-fork CI: builds the SIGNED Windows installer + updater manifest and
# attaches them to the GitHub release. Runs only when a release is published
# (i.e. on a version tag) or on manual dispatch — NOT on every commit.
# The updater (src-tauri/src/updater_channel.rs + tauri.conf plugins.updater)
# points at this fork's `releases/latest/download/latest.json`.

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # On a release, stamp the app version = release tag so the built installer
      # and the updater manifest both report the new version (the updater compares
      # the running app version against latest.json's version).
      - name: Set version from release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          V="${{ github.event.release.tag_name }}"; V="${V#v}"
          node -e "for (const f of ['package.json','src-tauri/tauri.conf.json']) { const c=require('./'+f); c.version=process.argv[1]; require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n'); } console.log('version ->', process.argv[1]);" "$V"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build signed installer
        env:
          # Faster, more parallel build than the repo's max-optimization default.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          # Signs the updater artifact (.sig). tauri.conf createUpdaterArtifacts=true.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --bundles nsis

      - name: Upload installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DragonFruit-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 30

      # Attach the installer + its signature + a generated updater manifest
      # (latest.json) to the release, so the in-app updater can find it at
      # releases/latest/download/latest.json.
      - name: Publish updater manifest + assets to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NSIS="src-tauri/target/release/bundle/nsis"
          EXE=$(ls "$NSIS"/*-setup.exe | head -1)
          SIG=$(ls "$NSIS"/*-setup.exe.sig | head -1)
          NAME=$(basename "$EXE")
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${NAME}"
          node -e "
            const fs=require('fs');
            const sig=fs.readFileSync(process.argv[1],'utf8').trim();
            const manifest={ version: process.argv[2], notes: 'DragonFruit '+process.argv[4], pub_date: new Date().toISOString(), platforms: { 'windows-x86_64': { signature: sig, url: process.argv[3] } } };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
            console.log('latest.json ->', manifest.version, manifest.platforms['windows-x86_64'].url);
          " "$SIG" "$VER" "$URL" "$TAG"
          gh release upload "$TAG" "$EXE" "$SIG" latest.json --clobber
