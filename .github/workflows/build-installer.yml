name: Build Windows Installer

# Personal-fork CI: builds the Windows redistributable (NSIS + MSI). Runs only
# when a release is published (i.e. on a version tag) or on manual dispatch —
# NOT on every commit — and attaches the installer to the release.
# The upstream org workflows were removed on this fork (they require org secrets
# and only produced failing-build email noise).

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # No TAURI_SIGNING_PRIVATE_KEY on a personal fork, so disable updater
      # artifact creation (which requires signing). The installers themselves
      # are unaffected. This edit is ephemeral to the CI checkout.
      - name: Disable updater signing
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle=c.bundle||{};c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2));console.log('createUpdaterArtifacts -> false');"

      - name: Build installer
        env:
          # Faster, more parallel build than the repo's max-optimization default
          # (fat LTO + codegen-units=1). Negligible runtime impact for this app.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: npm run tauri:build -- --bundles nsis

      - name: Upload installer (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DragonFruit-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # On a published release, also attach the installer as a downloadable
      # release asset so users get it from the Releases page, not just Actions.
      - name: Attach installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            src-tauri/target/release/bundle/nsis/*.exe --clobber
